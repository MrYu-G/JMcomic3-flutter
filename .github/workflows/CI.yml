name: Flutter CI

on:
  # Releases use the pinned local environment (docs/RELEASING.md).
  # File hygiene runs for every change; full diagnostics remain manual.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-files:
    name: Check repository files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject local outputs and private files
        shell: pwsh
        run: ./scripts/verify_repository_files.ps1 -IndexOnly

  analyze-and-test:
    name: Analyze and test
    if: github.event_name == 'workflow_dispatch'
    needs: repository-files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter from FVM config
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install native test build dependencies
        # window_manager/nativeapi builds C++ assets even for headless tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test integration_test test_driver

      - name: Test
        run: flutter test --no-pub --concurrency=1
