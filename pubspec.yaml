name: jmcomic3
description: jmcomic3 comic browser

publish_to: 'none'

version: 1.7.44+73

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  permission_handler: ^13.0.2
  flutter_styled_toast: ^2.3.0
  photo_view: ^0.15.0
  event: ^3.1.0
  modal_bottom_sheet: ^3.0.0
  url_launcher: ^6.3.3
  file_picker: ^13.4.1
  filesystem_picker: ^4.1.0
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.8
  window_manager: ^0.7.1
  zoomable_positioned_list:
    path: third_party/zoomable_positioned_list

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/version.txt
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
